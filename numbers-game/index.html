<!doctype html>
<html lang="en">
<head>

<body>
<title>NORSOFT: COLD EMAIL TOWER DEFENSE</title>
<style>
  :root {
    --phos: #39ff6e;
    --amber: #ffb000;
    --red: #ff5544;
    --cyan: #4de8ff;
    --grey: #8a9a8a;
    --purple: #b26bff;
    --bezel: #17181a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(900px 500px at 50% -10%, #14201a, #060707 65%), #060707;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 22px 12px 48px;
    font-family: "Courier New", ui-monospace, monospace;
    color: #cfe8d2;
  }
  .marquee { text-align: center; line-height: 1.1; }
  .marquee .title {
    font-size: clamp(26px, 6vw, 44px);
    font-weight: bold;
    letter-spacing: 6px;
    color: var(--phos);
    text-shadow: 0 0 18px rgba(57,255,110,.55), 0 0 2px rgba(57,255,110,.9);
  }
  .marquee .sub {
    font-size: 12px; letter-spacing: 3px; color: var(--amber);
    text-shadow: 0 0 10px rgba(255,176,0,.4); margin-top: 6px;
  }
  .cabinet {
    background: var(--bezel);
    border: 1px solid #26282b;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 30px 70px rgba(0,0,0,.7), inset 0 1px 0 #2e3134;
    max-width: 100%;
  }
  .screen-wrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; line-height: 0; }
  canvas#game { image-rendering: pixelated; display: block; max-width: 100%; max-height: 82vh; width: auto; height: auto; margin: 0 auto; background: #000; touch-action: none; }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .glow { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(20,255,120,.09); }
  .under { max-width: 560px; width: 100%; font-size: 13px; line-height: 1.65; color: #91a893; }
  .under b { color: #cfe8d2; }
  .under .h { letter-spacing: 3px; color: var(--amber); font-weight: bold; margin: 18px 0 8px; }
  .under p { margin: 0 0 10px; }
  .mutebtn {
    font-family: inherit; background: none; border: 1px solid #2b2e31;
    color: #91a893; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer;
  }
  #initials {
    position: absolute; left: 50%; top: 68%;
    transform: translate(-50%, -50%);
    width: 120px; font-family: inherit; font-size: 34px;
    letter-spacing: 12px; text-align: center; text-transform: uppercase;
    background: #000; color: var(--phos); border: 2px solid var(--phos);
    outline: none; display: none; padding: 4px 0 4px 12px;
  }
  #email {
    position: absolute; left: 50%; top: 68%;
    transform: translate(-50%, -50%);
    width: 300px; font-family: inherit; font-size: 17px;
    text-align: center;
    background: #000; color: var(--phos); border: 2px solid var(--phos);
    outline: none; display: none; padding: 9px 6px;
  }
  #email::placeholder { color: #2c4433; }
  /* the index modal */
  #indexModal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(4,7,10,.97);
    display: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 48px;
  }
  .idxwrap { max-width: 560px; margin: 0 auto; }
  .idxbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
    position: sticky; top: 0;
    background: rgba(4,7,10,.97);
    padding: 8px 0;
  }
  .idxtitle { letter-spacing: 3px; color: var(--amber); font-weight: bold; font-size: 14px; }
  #idxClose {
    font-family: inherit; font-size: 13px; font-weight: bold;
    background: #101715; color: var(--phos);
    border: 1px solid var(--phos); border-radius: 6px;
    padding: 8px 16px; cursor: pointer;
  }
  .index { display: flex; flex-direction: column; gap: 7px; }
  .irow { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.03); border: 1px solid #1d211d; padding: 6px 10px; }
  .irow img { image-rendering: pixelated; flex: none; }
  .irow .it { font-size: 12px; line-height: 1.5; }
  .irow .it b { display: block; letter-spacing: 1px; }
  .isec { font-size: 10px; letter-spacing: 2.5px; color: #6f8672; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) { .scanlines { background: none; } }
  /* phones: compact marquee, tight chrome, big canvas */
  @media (max-width: 540px) {
    body { padding: 8px 4px 32px; gap: 8px; }
    .marquee .title { font-size: 20px; letter-spacing: 3px; }
    .marquee .sub { font-size: 9px; letter-spacing: 2px; margin-top: 2px; }
    .cabinet { padding: 6px; border-radius: 10px; }
    canvas#game { max-height: 84vh; }
  }
</style>

  <div class="title">NORSOFT</div>

      o.stop(AC.currentTime + (dur || 0.08) + 0.02);

      }
    return c;
  }

  var SUBJECTS = ["just circling back", "quick question", "per my last email", "bumping this", "thoughts?", "re: re: quick question", "I'll keep this short", "following up"];
  var SPEECH = {

  function pointAt(dist) {

    for (var i = 0; i < SEGLEN.length; i++) {
      if (d <= SEGLEN[i]) {

        return {
          x: PATH[i][0] + (PATH[i + 1][0] - PATH[i][0]) * t,
          y: PATH[i][1] + (PATH[i + 1][1] - PATH[i][1]) * t
        };

    }
    return { x: PATH[PATH.length - 1][0], y: PATH[PATH.length - 1][1] };
  }

  var SPOTS = [
    { x: 180, y: 72 }, { x: 320, y: 72 },
    { x: 150, y: 185 }, { x: 300, y: 185 },
    { x: 240, y: 315 }, { x: 120, y: 315 },

  /* ---------- certifications (skill-gated unlocks) ---------- */
  var certs = { target: false, pers: false, seq: false };
  var QUIZZES = [

  var state = "title"; // title | build | playing | gameover | initials | email | scores
  var money = 250, quota = 10, quotaMax = 10, day = 0, pendingDay = 1, meetings = 0, sentCount = 0, conversions = 0, burnedCount = 0, oversends = 0, bossesDown = 0;

      if (d.warm && d.rep < 100) d.rep = Math.min(100, d.rep + 2 * dt);

      if (!canFire || d.promo > 0) return;
      var rate = d.warm ? 0.85 : 1.15;
      for (var i = 0; i < d.inboxes; i++) {
        d.cds[i] -= dt * fireRateMult;
        if (d.cds[i] <= 0) {
          var target = acquire(d);
          if (target) {
            d.cds[i] = rate * todayMods.rate;
            sentCount++;
            globalRep = Math.max(0, globalRep - repCostPerShot);
            d.heat += ((d.warm ? 4 : 7) / d.stack) * (algoAlive ? 1.5 : 1) * diff().heatMult;
            var crit = d.pers && Math.random() < 0.25;
            shots.push({
              x: d.x, y: d.y - 12, target: target,
              dmg: (crit ? 3 : 1) * d.stack, crit: crit, dom: d,
              scale: 1 + (d.stack - 1) * 0.5,
              subj: SUBJECTS[subjIdx++ % SUBJECTS.length],
              showSubj: Math.random() < 0.33
            });
            if (certs.seq && Math.random() < 0.25) {
              shots.push({
                x: d.x + 6, y: d.y - 8, target: target,
                dmg: 1, dom: d, subj: "the follow-up",
                showSubj: Math.random() < 0.33
              });
            }
            beep(880, 0.03, "square", 0.02);
            if (d.heat >= 100) {
              d.heat = 100;
              d.cooling = 12;
              oversends++;
              breakStreak(d.x, d.y - 44, "oversent");
              floatText(d.x, d.y - 30, "OVERSENT. COOLING OFF.", "#ffb000");
              beep(140, 0.3, "sawtooth", 0.05);
              break;
            }
          } else {
            d.cds[i] = 0.15;
          }
        }
      }
    });

    // the algorithm sends things to promotions
    if (algoAlive && canFire) {
      promoTimer -= dt;
      if (promoTimer <= 0) {
        promoTimer = 4;
        var live = domains.filter(function (d) { return !d.burned && d.cooling <= 0 && d.promo <= 0; });
        if (live.length) {
          var v = live[Math.floor(Math.random() * live.length)];
          v.promo = 2.5;
          floatText(v.x, v.y - 30, "SENT TO PROMOTIONS TAB", "#b26bff");
          beep(200, 0.2, "sawtooth", 0.04);
        }
      }
    }
  }

  function acquire(d) {
    var best = null, bestDist = 1e9;
    creeps.forEach(function (c) {
      if (!c.alive) return;
      if (d.target && c.type === "fish") return;
      var dist = Math.hypot(c.x - d.x, c.y - d.y);
      if (dist < rangeOf(d) && dist < bestDist) { best = c; bestDist = dist; }
    });
    return best;
  }

  function update(dt) {
    blink += dt;
    if (quitArm > 0) quitArm = Math.max(0, quitArm - dt);
    if (quotaFlash > 0) quotaFlash -= dt;

    if (state === "build") {
      if (dayClearT > 0) dayClearT -= dt;
      domainMaintenance(dt, false);
      if (quizFeedback) {
        quizT -= dt;
        if (quizT <= 0) {
          if (quizFeedback.retry) { quizFeedback = null; }
          else { quiz = null; quizFeedback = null; }
        }
      }
      floats.forEach(function (f) { f.t -= dt; f.y -= 24 * dt; });
      floats = floats.filter(function (f) { return f.t > 0; });
      return;
    }
    if (state === "gameover" || state === "win") { stateTimer -= dt; return; }
    if (state !== "playing") return;

    dayT += dt;

    // incoming warning holds the wave for a beat
    if (warnT > 0) warnT -= dt;

    // spawn
    if (warnT <= 0 && spawnQueue.length) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        var type = spawnQueue.shift();
        var def = CREEP_DEF[type];
        // geometric compounding curve (research-backed): early days feel
        // near-flat, late days accelerate hard — a linear-in-multiplier
        // curve can never keep pace with a compounding player economy
        var hp = Math.ceil(def.hp * Math.pow(diff().hpCurve, day - 1));
        if (type === "committee") hp = Math.ceil(24 * 1.3 * Math.pow(diff().hpCurve, day - 1));
        if (type === "algorithm") hp = Math.ceil(20 * 1.3 * Math.pow(diff().hpCurve, day - 1));
        var spdMult = Math.min(diff().spdCap, 1 + (day - 1) * diff().spdCurve);
        var nc = { type: type, hp: hp, maxhp: hp, speed: def.speed * (0.9 + Math.random() * 0.2) * spdMult * todayMods.speed * diff().speed, dist: 0, x: PATH[0][0], y: PATH[0][1], alive: true };
        if (type === "fish" && !fishIntroDone) {
          fishIntroDone = true;
          nc.introT = 2.5;
          floatText(nc.x, Math.max(40, nc.y), "THE FISH · DO NOT EMAIL", "#ff5544", 2.5);
        }
        creeps.push(nc);
        spawnTimer = type === "committee" || type === "algorithm" ? 1.6 : Math.max(0.55, 1.15 - day * 0.05);
      }
    }

    // move creeps (CEOs stop to check their phone: 2x damage window)
    creeps.forEach(function (c) {
      if (!c.alive) return;
      if (c.introT) c.introT -= dt;
      if (c.type === "ceo") {
        c.pt = (c.pt || 0) + dt;
        c.paused = (c.pt % 5) > 3.8;
      }
      if (!c.paused) c.dist += c.speed * dt;
      var p = pointAt(c.dist);
      c.x = p.x; c.y = p.y;
      if (c.dist >= TOTLEN) {
        c.alive = false;
        if (c.type === "fish") {
          floatText(c.x, c.y - 14, "the fish swims away. correctly.", "#8a9a8a");
        } else if (c.type === "committee" || c.type === "algorithm") {
          quota -= 3;
          quotaFlash = 0.8;
          floatText(W - 40, 44, "-3", "#ff5544", 1.2, 13);
          floatText(c.x, c.y - 14, "THE BOSS WALKED. -3 QUOTA", "#ff5544");
          beep(90, 0.4, "sawtooth", 0.06);
          if (quota <= 0) { quota = 0; gameOver(); }
        } else {
          quota--;
          quotaFlash = 0.8;
          floatText(W - 40, 44, "-1", "#ff5544", 1.2, 13);
          breakStreak(c.x, c.y - 30, "they walked");
          floatText(c.x, c.y - 14, "WENT WITH THE GUY. -1 QUOTA", "#ff5544");
          beep(110, 0.25, "sawtooth", 0.05);
          if (quota <= 0) { quota = 0; gameOver(); }
        }
      }
    });
    creeps = creeps.filter(function (c) { return c.alive; });

    domainMaintenance(dt, true);

    founderCd = Math.max(0, founderCd - dt);
    replyDrops.forEach(function (rd) { rd.t -= dt; });
    replyDrops = replyDrops.filter(function (rd) { return rd.t > 0; });

    // shots home in
    shots.forEach(function (s) {
      var t = s.target;
      var tx = t && t.alive ? t.x : s.lx || s.x;
      var ty = t && t.alive ? t.y : s.ly || s.y - 40;
      s.lx = tx; s.ly = ty;
      var dx = tx - s.x, dy = ty - s.y;
      var dist = Math.hypot(dx, dy) || 1;
      var sp = 300 * dt;
      s.x += (dx / dist) * sp;
      s.y += (dy / dist) * sp;
      if (dist < 10) {
        s.hit = true;
        if (t && t.alive) hitCreep(t, s);
      }
    });
    shots = shots.filter(function (s) { return !s.hit && s.y > -20 && s.y < H && s.x > -20 && s.x < W + 20; });

    // speech bubbles
    bubbleTimer -= dt;
    if (bubble) {
      bubble.t -= dt;
      if (bubble.t <= 0 || !bubble.c.alive) bubble = null;
    } else if (bubbleTimer <= 0) {
      var bossUp = creeps.some(function (c) { return c.alive && (c.type === "committee" || c.type === "algorithm"); });
      if (!bossUp) {
        var alive = creeps.filter(function (c) { return c.alive && c.y > 20 && c.y < UIY - 60; });
        if (alive.length) {
          var c = alive[Math.floor(Math.random() * alive.length)];
          var bank = SPEECH[c.type] && (c.type === "fish" || c.type === "committee" || c.type === "algorithm" || Math.random() < 0.5)
            ? SPEECH[c.type] : SPEECH.any;
          bubble = { c: c, txt: bank[Math.floor(Math.random() * bank.length)], t: 1.7 };
        }
      }
      bubbleTimer = 2.6 + Math.random() * 1.6;
    }

    // day cleared
    if (!spawnQueue.length && !creeps.some(function (c) { return c.alive; })) {
      endDay();
    }

    floats.forEach(function (f) { f.t -= dt; f.y -= 24 * dt; });
    floats = floats.filter(function (f) { return f.t > 0; });
  }

  function hitCreep(c, s) {
    if (c.type === "fish") {
      breakStreak(c.x, c.y + 12, "spam complaint");
      if (s.dom) {
        s.dom.rep -= 15;
        floatText(c.x, c.y - 16, "SPAM COMPLAINT -15 REP", "#ff5544");
        if (!complaintTaught) {
          complaintTaught = true;
          floatText(W / 2, 220, "untargeted domains email everyone · TARGETING (CERT 1) fixes this", "#8a9a8a", 3, 10);
        }
        beep(120, 0.15, "sawtooth", 0.04);
        c.hp -= s.dmg;
        if (c.hp <= 0) {
          c.alive = false;
          s.dom.rep -= 20;
          floatText(c.x, c.y, "you emailed a fish to death. -20 REP", "#8a9a8a");
        }
        if (s.dom.rep <= 0) {
          s.dom.rep = 0;
          s.dom.burned = true;
          burnedCount++;
          floatText(s.dom.x, s.dom.y - 30, "DOMAIN BLACKLISTED", "#ff5544");
          beep(80, 0.4, "sawtooth", 0.06);
        }
      }
      return;
    }
    var dmg = s.dmg;
    if (c.type === "ops" && s.dom && !s.dom.warm) {
      dmg = dmg * 0.5;
      if (!c.spf) { c.spf = true; floatText(c.x, c.y - 26, "their filter checked your SPF", "#8a9a8a"); }
    }
    if (c.type === "ceo" && c.paused) {
      dmg *= 2;
      floatText(c.x, c.y - 26, "CAUGHT ON THEIR PHONE x2", "#4de8ff");
    }
    if (s.crit) {
      floatText(c.x, c.y - 38, "IT SAID THEIR NAME. x3", "#39ff6e");
      if (perm.spintax) {
        var near = null, nd = 60;
        creeps.forEach(function (o) {
          if (o.alive && o !== c) {
            var dd = Math.hypot(o.x - c.x, o.y - c.y);
            if (dd < nd) { near = o; nd = dd; }
          }
        });
        if (near) hitCreep(near, { dmg: 1, dom: s.dom });
      }
    }
    s = { dmg: dmg, crit: s.crit, dom: s.dom };
    c.hp -= s.dmg;
    if (c.hp <= 0) {
      c.alive = false;
      conversions++;
      streak++;
      var b = CREEP_DEF[c.type].bounty;
      money += Math.round(b * bountyMult(day));
      var pts = Math.round(b * mult() * todayMods.score * diff().score);
      scorePts += pts;
      floatText(c.x, c.y - 14, "+" + pts + " PTS", "#ffb000");
      replyDrops.push({ x: c.x, y: c.y, val: Math.max(10, Math.round(b * 0.4 * todayMods.reply)), t: 3.2, gold: c.type === "ceo" || c.type === "committee" || c.type === "algorithm" });
      if (c.type === "ceo") { meetings++; floatText(c.x, c.y, "MEETING BOOKED +$" + b, "#39ff6e"); }
      else if (c.type === "committee") {
        meetings += 2; bossesDown++;
        floatText(c.x, c.y - 10, "COMMITTEE CONVERTED +$" + b, "#39ff6e");
        floatText(c.x, c.y + 8, "it disbands into stakeholders", "#ffb000");
        for (var i = 0; i < 3; i++) {
          creeps.push({ type: "ops", hp: 2, maxhp: 2, speed: 52, dist: Math.max(0, c.dist - i * 14), x: c.x, y: c.y, alive: true });
        }
        beep(990, 0.25, "square", 0.05);
      }
      else if (c.type === "algorithm") {
        bossesDown++;
        floatText(c.x, c.y, "THE ALGORITHM RELENTS +$" + b, "#b26bff");
        beep(990, 0.25, "square", 0.05);
      }
      else floatText(c.x, c.y, "CONVERTED +$" + b, c.type === "ops" ? "#39ff6e" : "#4de8ff");
      if (c.type !== "committee" && c.type !== "algorithm") beep(660, 0.08, "square", 0.04);
    } else {
      if (c.type === "committee" || c.type === "algorithm") {
        if (Math.random() < 0.25) floatText(c.x, c.y - 26, "OPENED. NO REPLY.", "#8a9a8a");
      } else if (!c.openedShown) {
        c.openedShown = true;
        floatText(c.x + (Math.random() * 16 - 8), c.y - 14, "OPENED", "#8a9a8a");
      }
    }
  }

  /* ---------- draw ---------- */
  function fs(s) { return Math.max(12, Math.round((s || 14) * 1.25)); }
  function text(t, x, y, size, color, align) {
    cx.fillStyle = color || "#cfe8d2";
    cx.font = "bold " + fs(size) + "px 'Courier New', monospace";
    cx.textAlign = align || "center";
    cx.fillText(t, x, y);
  }
  function drawSprite(img, x, y, scale) {
    var sc = scale || 1;
    cx.drawImage(img, Math.round(x - (img.width * sc) / 2), Math.round(y - (img.height * sc) / 2), img.width * sc, img.height * sc);
  }
  function rangeOf(d) { return 150 + (d.stack - 1) * 30; }
  function wrapText(t, x, y, maxW, size, color) {
    cx.font = "bold " + fs(size) + "px 'Courier New', monospace";
    var words = t.split(" "), line = "", lines = [];
    words.forEach(function (w) {
      var test = line ? line + " " + w : w;
      if (cx.measureText(test).width > maxW) { lines.push(line); line = w; }
      else line = test;
    });
    lines.push(line);
    lines.forEach(function (l, i) { text(l, x, y + i * (fs(size) + 7), size, color); });
  }

  function drawPath() {
    cx.strokeStyle = "#101a12";
    cx.lineWidth = 26;
    cx.lineJoin = "round";
    cx.beginPath();
    cx.moveTo(PATH[0][0], PATH[0][1]);
    for (var i = 1; i < PATH.length; i++) cx.lineTo(PATH[i][0], PATH[i][1]);
    cx.stroke();
    cx.strokeStyle = "#1e2f22";
    cx.lineWidth = 2;
    cx.setLineDash([6, 8]);
    cx.beginPath();
    cx.moveTo(PATH[0][0], PATH[0][1]);
    for (i = 1; i < PATH.length; i++) cx.lineTo(PATH[i][0], PATH[i][1]);
    cx.stroke();
    cx.setLineDash([]);
  }

  function drawDomain(d) {
    var img = d.burned ? SPR.compDead : (Math.floor(blink * 4) % 2 ? SPR.compA : SPR.compB);
    drawSprite(img, d.x, d.y);
    if (d.stack > 1) text("×" + d.stack + " · " + d.inboxes + "/" + d.stack * 3, d.x + 26, d.y + 27, 8, "#4de8ff", "left");
    if (placing) text("STACK +$" + COST.domain * (d.stack + 1), d.x, d.y - 36, 9, "#4de8ff");
    if (d === selected) {
      cx.lineWidth = 2;
      cx.strokeStyle = "#ffffff";
      cx.strokeRect(d.x - 23.5, d.y - 17.5, 47, 35);
    }
    var coolBlink = d.cooling > 0 && Math.floor(blink * 3) % 2 === 0;
    for (var i = 0; i < 3; i++) {
      cx.fillStyle = i < d.inboxes
        ? (d.burned ? "#5a2a22" : coolBlink ? "#ffb000" : d.cooling > 0 ? "#4a3a10" : "#39ff6e")
        : "#1c2a20";
      cx.fillRect(d.x - 14 + i * 10, d.y + 20, 7, 5);
    }
    if (d.warm) text("W", d.x - 26, d.y + 4, 9, "#ffb000");
    if (d.pers) text("P", d.x + 26, d.y + 4, 9, "#39ff6e");
    if (d.target) text("T", d.x + 26, d.y - 8, 9, "#4de8ff");
    if (d.burned) text("BLACKLISTED", d.x, d.y - 26, 8, "#ff5544");
    else if (d.promo > 0) text("PROMOTIONS TAB", d.x, d.y - 26, 8, "#b26bff");
    else if (d.cooling > 0) text("COOLING 0:" + String(Math.ceil(d.cooling)).padStart(2, "0"), d.x, d.y - 26, 8, "#ffb000");
    else if (d.heat >= 75) text("SENDING TOO FAST", d.x, d.y - 26, 8, "#ffb000");
    // heat bar
    cx.strokeStyle = "#3a2f10";
    cx.strokeRect(d.x - 20, d.y + 34, 40, 4);
    cx.fillStyle = d.heat >= 75 ? "#ff5544" : "#ffb000";
    cx.fillRect(d.x - 20, d.y + 34, Math.max(0, Math.min(100, d.heat)) * 0.4, 4);
    // rep bar
    cx.strokeStyle = "#2c4433";
    cx.strokeRect(d.x - 20, d.y + 28, 40, 5);
    cx.fillStyle = d.rep > 50 ? "#39ff6e" : d.rep > 25 ? "#ffb000" : "#ff5544";
    cx.fillRect(d.x - 20, d.y + 28, Math.max(0, d.rep) * 0.4, 5);
    if (!d.burned && (d === selected || d.bornT > 0)) {
      var ringA = d.bornT > 0 ? 0.25 + 0.25 * (d.bornT / 0.8) : 0.40;
      cx.strokeStyle = "rgba(57,255,110," + ringA.toFixed(3) + ")";
      cx.beginPath();
      cx.arc(d.x, d.y, rangeOf(d), 0, Math.PI * 2);
      cx.stroke();
    }
  }

  function drawBubble(b) {
    var pad = 7, size = 13;
    cx.font = "bold " + size + "px 'Courier New', monospace";
    var w = cx.measureText(b.txt).width + pad * 2;
    var x = Math.max(6, Math.min(W - 6 - w, b.c.x - w / 2));
    var y = b.c.y - 48;
    cx.fillStyle = "#000";
    cx.fillRect(x, y, w, 24);
    cx.strokeStyle = "#8a9a8a";
    cx.strokeRect(x + 0.5, y + 0.5, w, 24);
    cx.fillStyle = "#8a9a8a";
    cx.fillRect(b.c.x - 1, y + 24, 2, 5);
    cx.textAlign = "left";
    cx.fillText(b.txt, x + pad, y + 17);
  }

  function domainStatusLine(d) {
    return d.name + (d.stack > 1 ? " ×" + d.stack : "") + " · INBOX " + d.inboxes + "/" + d.stack * 3 + " · " +
      (d.warm ? "W✓" : "W✗") + " " + (d.target ? "T✓" : "T✗") + " " + (d.pers ? "P✓" : "P✗") +
      " · REP " + Math.round(Math.max(0, d.rep)) + "%";
  }

  function drawShop() {
    cx.fillStyle = "#0c0f0d";
    cx.fillRect(0, UIY, W, H - UIY);
    cx.strokeStyle = "#1e2f22";
    cx.strokeRect(0.5, UIY + 0.5, W - 1, H - UIY - 1);
    var pulse = Math.floor(blink * 2) % 2;
    var anyBurned = domains.some(function (d) { return d.burned; });
    var hint, hintColor = "#8a9a8a";
    if (placing) {
      hint = "TAP A DESK SPACE TO PLACE THE DOMAIN · TAP ELSEWHERE TO CANCEL";
    } else if (selected) {
      if (selected.burned) hint = "DOMAIN BLACKLISTED. SWAP TO REVIVE.";
      else { hint = domainStatusLine(selected); hintColor = "#cfe8d2"; }
    } else if (state === "build" && domains.length === 0) {
      hint = "▼ BUY A DOMAIN ($150) TO BEGIN"; hintColor = "#ffb000";
    } else if (anyBurned) {
      hint = "A DOMAIN IS BLACKLISTED. TAP IT, THEN SWAP"; hintColor = "#ff5544";
    } else {
      hint = "BUY A DOMAIN, THEN TAP IT TO UPGRADE";
    }
    text(hint, W / 2, UIY + 16, 9, hintColor);
    shopRects().forEach(function (rc, i) {
      var s = SHOP[i];
      var locked = s.cert && !certs[s.cert];
      var afford = money >= s.cost && !locked;
      var owned = false;
      if (selected) {
        if (s.key === "inbox" && selected.inboxes >= selected.stack * 3) owned = true;
        if (s.key === "warmup" && selected.warm) owned = true;
        if (s.key === "target" && selected.target) owned = true;
        if (s.key === "pers" && selected.pers) owned = true;
      }
      cx.fillStyle = "#101715";
      cx.fillRect(rc.x, rc.y, rc.w, rc.h);
      var edge = afford ? "#2c4433" : "#26221e";
      if (s.key === "domain" && state === "build" && domains.length === 0 && pulse) edge = "#39ff6e";
      if (s.key === "swap" && anyBurned && pulse) edge = "#ff5544";
      cx.strokeStyle = edge;
      cx.strokeRect(rc.x + 0.5, rc.y + 0.5, rc.w, rc.h);
      var label = owned ? (s.key === "inbox" ? "FULL" : "OWNED") : s.label;
      text(label, rc.x + rc.w / 2, rc.y + 23, 10, afford ? "#cfe8d2" : "#555");
      var priceTxt = locked ? (s.cert === "target" ? "CERT 1" : "CERT 2") : "$" + s.cost;
      var priceColor = locked ? "#8a9a8a" : owned ? "#3d5544" : afford ? "#39ff6e" : "#555";
      text(priceTxt, rc.x + rc.w / 2, rc.y + 42, 10, priceColor);
    });
    var sr = startRect();
    var mb = menuBtnRect();
    if (state === "playing" || (state === "build" && !quiz && !briefing)) {
      cx.fillStyle = quitArm > 0 ? "#3a1210" : "#101715";
      cx.fillRect(mb.x, mb.y, mb.w, mb.h);
      cx.strokeStyle = quitArm > 0 ? "#ff5544" : "#2c4433";
      cx.strokeRect(mb.x + 0.5, mb.y + 0.5, mb.w, mb.h);
      text("≡", mb.x + mb.w / 2, mb.y + 19, 12, quitArm > 0 ? "#ff5544" : "#8a9a8a");
    }
    if (quitArm > 0 && (state === "playing" || state === "build")) {
      text("TAP ≡ AGAIN TO ABANDON THE RUN", W / 2 + 20, sr.y + 19, 10, "#ff5544");
    } else if (state === "build") {
      if (quiz) {
        text("CERTIFICATION IN PROGRESS", W / 2, sr.y + 19, 10, "#ffb000");
      } else if (briefing) {
        text("MORNING BRIEFING", W / 2, sr.y + 19, 10, "#ffb000");
      } else if (domains.length === 0) {
        cx.fillStyle = "#101715";
        cx.fillRect(sr.x, sr.y, sr.w, sr.h);
        cx.strokeStyle = "#26221e";
        cx.strokeRect(sr.x + 0.5, sr.y + 0.5, sr.w, sr.h);
        text("BUILD FIRST · NO DOMAINS LIVE", W / 2, sr.y + 19, 10, "#8a9a8a");
      } else {
        cx.fillStyle = pulse ? "#183a24" : "#12291a";

    row(null, "NET REP (global)", "Every inbox on the board shares ONE sending-reputation pool. Past 3 total active inboxes, each send costs more rep, and low rep slows EVERY domain's fire rate at once, not just the newest one. Warmed-up domains regen it faster. This is why real senders spread volume across many domains instead of stacking inboxes on one — buying more firepower stops being free past a certain scale.", "GLOBAL PRESSURE");
    row(null, "BOUNTY TAX", "Kills are worth less as the run goes on: full price through day 5, then 75%, 55%, 40%, and 30% of face value by day 18+. Your economy can't just out-earn the wave forever — the same thing BTD6 does to stop a strong early build from trivializing the back half.");
    row(null, "DOMAIN STACKING", "In placing mode, tap an occupied desk to stack another domain there. Price scales ($300 for the 2nd, $450 for the 3rd...): +3 inbox capacity, bigger emails that hit harder (damage x stack), +30 range per stack, and send heat spreads across the stack, which is literally why real senders split volume across domains. The catch: one shared reputation, so a blacklist takes the whole tower down.", "QUALITY OF LIFE");
    row(null, "SPEED TOGGLE (▶▶)", "Bottom-right chip during waves cycles x1, x2, x3 game speed. For when you have built the machine and just want to watch it print.");
    row(null, "THE LEADERBOARD EMAIL", "Claiming a leaderboard spot asks for your email, and the game tells you the truth: we will absolutely cold email you. In this mockup it stays on your device; production wires it to a Norsoft endpoint.", "LEAD CAPTURE");
  })();

  /* ---------- loop ---------- */
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    if (state === "playing") dt *= speedMult;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
